name: WaterEject
options:
  bundleIdPrefix: com.hankun
  deploymentTarget:
    iOS: "26.0"
settings:
  SWIFT_VERSION: "5.0"
  TARGETED_DEVICE_FAMILY: "1"
  DEVELOPMENT_TEAM: 47GJJ2S5J8
  CODE_SIGN_STYLE: Automatic
targets:
  WaterEject:
    type: application
    platform: iOS
    sources: [WaterEject]
    scheme: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.hankun.watereject
      TARGETED_DEVICE_FAMILY: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
    info:
      path: WaterEject/Info.plist
      properties:
        CFBundleDisplayName: Speaker Super Dry
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
